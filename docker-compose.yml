services:
  backend:
    build:
      context: ./backend
    environment:
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}
      AWS_REGION: ${AWS_REGION:-}
      AWS_USE_MOCK: ${AWS_USE_MOCK:-true}
      AI_PROVIDER: ${AI_PROVIDER:-bedrock}
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-false}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-5-sonnet-20241022-v2:0}
      STRANDS_ENABLED: ${STRANDS_ENABLED:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
